<mat-card *ngIf="user$ | async as user" class="user-detail-header">
    <button
    mat-icon-button
    class="fix-upper-right-corner"
    [matMenuTriggerFor]="usermenu"
  >
    <mat-icon>more_vert</mat-icon>
  </button>
  <mat-menu #usermenu="matMenu">
    <button mat-menu-item (click)="editBasicInfo()">Edit</button>
  </mat-menu>
  <img class="user-profile-img" src="assets/imgs/unknown.png" alt="" />
  <div class="user-detail-header-info">
    <h2>{{ user.firstName }} {{ user.lastName }}</h2>
    {{ user.email }}
  </div>
</mat-card>

<mat-card *ngIf="user$ | async as user" class="mt-32">
  <button
    mat-icon-button
    class="fix-upper-right-corner"
    [matMenuTriggerFor]="addressmenu"
  >
    <mat-icon>more_vert</mat-icon>
  </button>
  <mat-menu #addressmenu="matMenu">
    <button mat-menu-item (click)="editAdress()">Edit</button>
  </mat-menu>
  <mat-card-header>
    <mat-card-title>Address</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>{{ user.street }}</p>
    <p>{{ user.zipCode }} {{ user.city }}</p>
    <p>{{ user.birthDate ? (user.birthDate | date : "dd.MM.yyyy") : "" }}</p>
  </mat-card-content>
</mat-card>
